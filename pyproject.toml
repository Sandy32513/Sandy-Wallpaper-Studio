[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandy-wallpaper-studio"
version = "V1.0.0"
description = "Professional 4K/5K/8K wallpaper management application for Windows 10/11"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Sandy"},
]
keywords = ["wallpaper", "4k", "5k", "8k", "windows", "desktop", "manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.2.0",
    "ImageHash>=4.3.1",
    "requests>=2.32.2,<3",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]
packaging = [
    "pyinstaller==6.22.3",
]

[project.scripts]
sandy-wallpaper-studio = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # Line too long (managed by layout/readability)
    "UP045",  # non-pep604-annotation-optional (Optional[T] is standard and readable)
    "SIM105", # suppressible-exception (try-except-pass is explicit and clear)
    "SIM118", # in-dict-keys (.keys() is explicit and clear)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "B018"]  # Allow test naming conventions, variables, and expressions

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
