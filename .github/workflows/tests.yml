name: Tests

on:
  push:
    branches:
      - main
      - "chore/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Windows / Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package entry points
        run: |
          python -m app --version
          sandy-wallpaper-studio --version

      - name: Run Ruff linter
        run: |
          python -m ruff check app tests scripts

      - name: Run mypy
        run: |
          python -m mypy app

      - name: Run test suite
        run: |
          python -m pytest -v

  package-validation:
    name: Package Smoke (Windows / Python 3.12)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and pinned packaging dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[packaging]"

      - name: Build and smoke-test the internal bundle
        run: |
          .\scripts\build_windows.ps1 -PythonPath "$PWD\.venv\Scripts\python.exe" -SkipDependencyInstall -SkipPreBuildChecks
